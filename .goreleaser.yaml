version: 2

project_name: tunnels

before:
  hooks:
    - go mod tidy
    - ./build-ui.sh
    - ./build-parser.sh

builds:
  - id: tunnels-cli
    main: ./cmd/main
    binary: tunnels-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-server
    main: ./server
    binary: tunnels-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-app-windows
    main: ./cmd/wails
    binary: tunnels-app
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    tags:
      - desktop
      - production
    ldflags:
      - -s -w -H windowsgui -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-app-linux
    main: ./cmd/wails
    binary: tunnels-app
    skip: '{{ ne .Runtime.Goos "linux" }}'
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - desktop
      - production
      - webkit2_41
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-app-darwin
    main: ./cmd/wails
    binary: tunnels-app
    skip: '{{ ne .Runtime.Goos "darwin" }}'
    env:
      - CGO_ENABLED=1
      # Wails UTType file filters need UniformTypeIdentifiers (missing from wails v2.11 cgo LDFLAGS)
      - CGO_LDFLAGS=-framework UniformTypeIdentifiers
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    tags:
      - desktop
      - production
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

dist: ./builds

archives:
  - id: tunnels-cli
    ids:
      - tunnels-cli
    formats:
      - tar.gz
    name_template: >-
      tunnels-cli_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: tunnels-server
    ids:
      - tunnels-server
    formats:
      - tar.gz
    name_template: >-
      tunnels-server_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  - id: tunnels-app
    ids:
      - tunnels-app-windows
      - tunnels-app-linux
      - tunnels-app-darwin
    formats:
      - tar.gz
    name_template: >-
      tunnels-app_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
