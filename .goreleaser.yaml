version: 2

project_name: tunnels

before:
  hooks:
    - go mod tidy
    - ./build-parser.sh

builds:
  - id: tunnels-cli
    main: ./cmd/main
    binary: tunnels-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-server
    main: ./server
    binary: tunnels-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

dist: ./builds

archives:
  - id: tunnels-cli
    ids:
      - tunnels-cli
    formats:
      - tar.gz
    name_template: >-
      tunnels-cli_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: tunnels-server
    ids:
      - tunnels-server
    formats:
      - tar.gz
    name_template: >-
      tunnels-server_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

release:
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
