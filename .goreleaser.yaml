# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: tunnels

before:
  hooks:
    - go mod tidy
    # Build the shared React UI and copy it into both client entrypoints
    # (cmd/main for the CLI, cmd/wails for the desktop app).
    - ./build-ui.sh
    - ./build-parser.sh

builds:
  # ---------------------------------------------------------------------------
  # tunnels-cli — headless / browser UI client (embeds frontend, no Wails)
  # Entry: ./cmd/main (wraps the client package)
  # ---------------------------------------------------------------------------
  - id: tunnels-cli
    main: ./cmd/main
    binary: tunnels-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  # ---------------------------------------------------------------------------
  # tunnels-server — control plane / API server
  # ---------------------------------------------------------------------------
  - id: tunnels-server
    main: ./server
    binary: tunnels-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  # ---------------------------------------------------------------------------
  # tunnels-app — Wails desktop client
  #
  # Windows is pure-Go (CGO_ENABLED=0) and cross-compiles from any host.
  # Linux/macOS need native CGO + system webview libs, so those builds are
  # only attempted on a matching host (mirrors ./build-wails.sh).
  # ---------------------------------------------------------------------------
  - id: tunnels-app-windows
    main: ./cmd/wails
    binary: tunnels-app
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    tags:
      - desktop
      - production
    ldflags:
      - -s -w -H windowsgui -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-app-linux
    main: ./cmd/wails
    binary: tunnels-app
    # Requires: libgtk-3-dev libwebkit2gtk-4.1-dev (or equivalent)
    skip: '{{ ne .Runtime.Goos "linux" }}'
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    tags:
      - desktop
      - production
      - webkit2_41
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-app-darwin
    main: ./cmd/wails
    binary: tunnels-app
    # Requires a macOS host with Xcode CLT
    skip: '{{ ne .Runtime.Goos "darwin" }}'
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    tags:
      - desktop
      - production
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

dist: ./builds

archives:
  - id: tunnels-cli
    ids:
      - tunnels-cli
    formats:
      - tar.gz
    name_template: >-
      tunnels-cli_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: tunnels-server
    ids:
      - tunnels-server
    formats:
      - tar.gz
    name_template: >-
      tunnels-server_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

  - id: tunnels-app
    ids:
      - tunnels-app-windows
      - tunnels-app-linux
      - tunnels-app-darwin
    formats:
      - tar.gz
    name_template: >-
      tunnels-app_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
