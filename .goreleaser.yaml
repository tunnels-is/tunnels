version: 2

project_name: tunnels

before:
  hooks:
    - ./build-parser.sh

builds:
  - id: tunnels-cli
    main: ./cmd/main
    binary: tunnels-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

  - id: tunnels-server
    main: ./server
    binary: tunnels-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    ldflags:
      - -s -w -X github.com/tunnels-is/tunnels/version.Version={{.Version}}
    flags:
      - -trimpath

dist: ./builds

archives:
  - id: tunnels-cli
    ids:
      - tunnels-cli
    formats:
      - tar.gz
    name_template: >-
      tunnels-cli_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: tunnels-server
    ids:
      - tunnels-server
    formats:
      - tar.gz
    name_template: >-
      tunnels-server_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

# Snapshots and local publishes skip the SBOM, so make release and
# releaser-build-release.sh do not need syft. The tag workflow sets
# TUNNELS_RELEASE_SBOM=1. Signing is not configured here: GoReleaser OSS
# cannot skip signs, and a missing signature file fails a local publish.
checksum:
  name_template: "tunnels_{{ .Version }}_checksums.txt"
  algorithm: sha256
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    disable: '{{ if or .IsSnapshot (ne (index .Env "TUNNELS_RELEASE_SBOM") "1") }}true{{ else }}false{{ end }}'
    args: ["$artifact", "--output", "spdx-json=$document"]

release:
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
