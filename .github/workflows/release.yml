name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: macos-latest
            target: darwin
          - runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux desktop deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev pkg-config

      - name: Install MinGW
        if: matrix.target == 'windows'
        run: choco install mingw -y

      - name: Set version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          VERSION: ${{ env.VERSION }}
        run: ./build-fyne.sh ${{ matrix.target }}

      - name: Package (Linux)
        if: matrix.target == 'linux'
        run: |
          tar czf "tunnels-app_${VERSION}_linux_amd64.tar.gz" -C bin tunnels-app-linux-amd64 tunnels.png tunnels.desktop
          echo "ASSET=tunnels-app_${VERSION}_linux_amd64.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.target == 'darwin'
        run: |
          ASSET="tunnels-app_${VERSION}_darwin_universal.zip"
          ditto -c -k --keepParent bin/Tunnels-darwin-arm64.app "$ASSET" || \
            ditto -c -k --keepParent bin/Tunnels-darwin-amd64.app "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: bash
        run: |
          7z a "tunnels-app_${VERSION}_windows_amd64.zip" ./bin/tunnels-app-windows-amd64.exe
          echo "ASSET=tunnels-app_${VERSION}_windows_amd64.zip" >> "$GITHUB_ENV"

      - name: Upload desktop app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
