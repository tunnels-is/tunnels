name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum
        run: go mod tidy -diff

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/syft-bin"
          mkdir -p "$dir"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.55.0/install.sh | sh -s -- -b "$dir" v1.55.0
          echo "$dir" >> "$GITHUB_PATH"
          bin="$dir/syft"
          if [ -f "$dir/syft.exe" ]; then
            bin="$dir/syft.exe"
          fi
          "$bin" version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUNNELS_RELEASE_SBOM: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign release artifacts
        shell: bash
        env:
          COSIGN_YES: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/release-sign-dist.sh ./builds

  desktop:
    needs: goreleaser
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}
      upload_release: true
    permissions:
      contents: write
      actions: write
      id-token: write
