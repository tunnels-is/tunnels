# Manual desktop rebuilds. Tag releases use release.yml.
name: Build Desktop Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string embedded in the binary (e.g. 1.2.3)"
        required: false
        default: "dev"

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ inputs.version }}
      upload_release: false
    permissions:
      contents: read
      actions: write
