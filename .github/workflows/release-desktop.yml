# Manual / optional desktop rebuilds. Tag releases use release.yml instead
# (GoReleaser for CLI/server/Windows/Linux + a native macOS job for Tunnels.app).
name: Build Desktop Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string embedded in the binary (e.g. 1.2.3)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: universal
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev" >> "$GITHUB_ENV"
          fi

      - name: Build frontend
        run: ./build-ui.sh

      - name: Build (Linux)
        if: matrix.goos == 'linux'
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags "desktop,production,webkit2_41" -trimpath \
            -ldflags "-s -w -X github.com/tunnels-is/tunnels/version.Version=${VERSION}" \
            -o tunnels-app ./cmd/wails

      - name: Build (macOS universal .app)
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: "-framework UniformTypeIdentifiers"
        run: |
          set -euo pipefail
          TAGS="desktop,production"
          LDFLAGS="-s -w -X github.com/tunnels-is/tunnels/version.Version=${VERSION}"

          GOOS=darwin GOARCH=arm64 go build -tags "$TAGS" -trimpath -ldflags "$LDFLAGS" \
            -o tunnels-app-arm64 ./cmd/wails
          GOOS=darwin GOARCH=amd64 go build -tags "$TAGS" -trimpath -ldflags "$LDFLAGS" \
            -o tunnels-app-amd64 ./cmd/wails

          lipo -create -output tunnels-app tunnels-app-arm64 tunnels-app-amd64
          ./scripts/package-darwin-app.sh tunnels-app Tunnels.app "$VERSION"

      - name: Build (Windows)
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          go build -tags "desktop,production" -trimpath \
            -ldflags "-s -w -H windowsgui -X github.com/tunnels-is/tunnels/version.Version=${VERSION}" \
            -o tunnels-app.exe ./cmd/wails

      - name: Package (Linux)
        if: matrix.goos == 'linux'
        run: |
          tar czf "tunnels-app_${VERSION}_linux_amd64.tar.gz" tunnels-app
          echo "ASSET=tunnels-app_${VERSION}_linux_amd64.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.goos == 'darwin'
        run: |
          ASSET="tunnels-app_${VERSION}_darwin_universal.zip"
          ditto -c -k --keepParent Tunnels.app "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          7z a "tunnels-app_${VERSION}_windows_amd64.zip" tunnels-app.exe
          echo "ASSET=tunnels-app_${VERSION}_windows_amd64.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnels-app-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
